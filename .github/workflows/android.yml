name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties

      - name: Build Debug & Release APK
        run: gradle assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Extract Version Info & Commit Notes
        id: version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          
          # Grab the full commit message (subject + body) as release notes
          COMMIT_NOTES=$(git log -1 --pretty=format:"%s%n%n%b")
          echo "COMMIT_NOTES<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          TAG="v${VERSION_NAME}"
          
          # Delete existing release/tag if it exists (safe re-run)
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          
          gh release create "$TAG" \
            --title "HeFoundSomethingInTheStore $TAG" \
            --notes "$COMMIT_NOTES" \
            "$APK_PATH"

      - name: Upload APK to GoFile (Fallback)
        if: always()
        run: |
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found (build likely failed before producing one). Skipping GoFile upload."
            exit 0
          fi
          echo "Uploading $APK_PATH to GoFile..."
          
          # 1. Get an available server to upload to
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys, json; print(json.load(sys.stdin)['data']['servers'][0]['name'])")
          
          # 2. Upload the file
          RESPONSE=$(curl -F "file=@$APK_PATH" "https://$SERVER.gofile.io/contents/uploadfile")
          
          # 3. Safely extract and print the link
          echo $RESPONSE | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              if data['status'] == 'ok':
                  print('\n--------------------------------------------------')
                  print('DOWNLOAD LINK: ' + data['data']['downloadPage'])
                  print('--------------------------------------------------\n')
              else:
                  print('GoFile Upload Failed: ' + str(data))
                  sys.exit(1)
          except Exception as e:
              print('Error parsing GoFile response: ' + str(e))
              sys.exit(1)
          "

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
